<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>『요괴문초: 좌도의 눈』 비공개 디렉터 허브</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --bg: #12100e;
    --panel: #1a1614;
    --border: #383129;
    --gold: #b99a5b;
    --gold-light: #dec691;
    --text: #e6ded0;
    --muted: #9c9182;
    --red: #8c2318;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: "Pretendard", -apple-system, BlinkMacSystemFont, sans-serif; }

  /* 잠금 화면 */
  #lock-screen {
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: radial-gradient(circle at 50% 30%, #211b17 0%, #12100e 70%);
  }
  .lock-card {
    width: 100%;
    max-width: 420px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 34px 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    text-align: center;
  }
  .lock-seal {
    width: 54px;
    height: 54px;
    margin: 0 auto 16px;
    border-radius: 50%;
    border: 1.5px solid var(--gold);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    color: var(--gold-light);
    background: rgba(185,154,91,0.08);
  }
  .lock-card h1 { font-size: 20px; color: var(--gold-light); margin-bottom: 6px; }
  .lock-card p { font-size: 13px; color: var(--muted); margin-bottom: 22px; line-height: 1.5; }
  .pw-input {
    width: 100%;
    padding: 12px 14px;
    background: #0d0b09;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 15px;
    outline: none;
    margin-bottom: 12px;
    text-align: center;
    letter-spacing: 2px;
  }
  .pw-input:focus { border-color: var(--gold); }
  .btn-unlock {
    width: 100%;
    padding: 12px;
    background: linear-gradient(135deg, #9c7d41, #b99a5b);
    color: #12100e;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .btn-unlock:hover { opacity: 0.9; }
  .btn-unlock:disabled { opacity: 0.5; cursor: wait; }
  .err-msg {
    margin-top: 12px;
    font-size: 13px;
    color: #f28b82;
    min-height: 18px;
  }
  .lock-meta {
    margin-top: 20px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--muted);
  }

  /* 포털 화면 */
  #portal-app {
    display: none;
    flex-direction: column;
    height: 100vh;
    width: 100%;
  }
  .topbar {
    background: #171311;
    border-bottom: 1px solid var(--border);
    padding: 0 18px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-shrink: 0;
  }
  .brand {
    font-size: 15px;
    font-weight: 700;
    color: var(--gold-light);
    white-space: nowrap;
  }
  .tabs {
    display: flex;
    gap: 6px;
    overflow-x: auto;
  }
  .tab-btn {
    background: transparent;
    border: 1px solid transparent;
    color: var(--muted);
    padding: 7px 14px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
  }
  .tab-btn:hover { color: var(--text); background: rgba(255,255,255,0.04); }
  .tab-btn.active {
    color: var(--gold-light);
    background: rgba(185,154,91,0.14);
    border-color: rgba(185,154,91,0.5);
  }
  .top-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .action-link {
    text-decoration: none;
    font-size: 12px;
    color: var(--gold);
    border: 1px solid var(--border);
    padding: 5px 10px;
    border-radius: 5px;
    white-space: nowrap;
  }
  .action-link:hover { border-color: var(--gold); }
  .btn-lock {
    background: rgba(140,35,24,0.2);
    border: 1px solid var(--red);
    color: #f28b82;
    font-size: 12px;
    padding: 5px 10px;
    border-radius: 5px;
    cursor: pointer;
    white-space: nowrap;
  }
  .frame-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
  }
  iframe.tab-frame {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    display: none;
    background: var(--bg);
  }
  iframe.tab-frame.active { display: block; }

  @media (max-width: 768px) {
    .brand { display: none; }
    .topbar { padding: 0 10px; }
    .tab-btn { padding: 6px 10px; font-size: 12px; }
    .action-link { display: none; }
  }
</style>
</head>

<script>
(function() {
  const vault = JSON.parse(document.getElementById('encrypted-vault').textContent);

  function b64ToBytes(b64) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }

  async function decryptData(password) {
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey(
      'raw',
      enc.encode(password),
      { name: 'PBKDF2' },
      false,
      ['deriveKey']
    );
    const key = await crypto.subtle.deriveKey(
      {
        name: 'PBKDF2',
        salt: b64ToBytes(vault.salt),
        iterations: vault.iter,
        hash: 'SHA-256'
      },
      keyMaterial,
      { name: 'AES-GCM', length: 256 },
      false,
      ['decrypt']
    );
    const decryptedBuf = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: b64ToBytes(vault.iv) },
      key,
      b64ToBytes(vault.data)
    );
    return JSON.parse(new TextDecoder().decode(decryptedBuf));
  }

  function mountPortal(docs) {
    document.getElementById('frame-dashboard').srcdoc = docs.dashboardHtml;
    document.getElementById('frame-storyline').srcdoc = docs.storylineHtml;
    document.getElementById('frame-reader').srcdoc = docs.readerHtml;
    document.getElementById('lock-screen').style.display = 'none';
    document.getElementById('portal-app').style.display = 'flex';
  }

  window.switchTab = function(tabName) {
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.tab === tabName);
    });
    document.querySelectorAll('.tab-frame').forEach(fr => {
      fr.classList.toggle('active', fr.id === 'frame-' + tabName);
    });
  };

  window.lockPortal = function() {
    document.getElementById('frame-dashboard').srcdoc = '';
    document.getElementById('frame-storyline').srcdoc = '';
    document.getElementById('frame-reader').srcdoc = '';
    document.getElementById('pw-input').value = '';
    document.getElementById('err-msg').textContent = '';
    document.getElementById('portal-app').style.display = 'none';
    document.getElementById('lock-screen').style.display = 'flex';
    document.getElementById('pw-input').focus();
  };

  window.addEventListener('message', function(e) {
    if (e.data && e.data.type === 'switch-tab' && e.data.tab) {
      window.switchTab(e.data.tab);
    }
  });

  document.getElementById('unlock-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const pw = document.getElementById('pw-input').value;
    const btn = document.getElementById('unlock-btn');
    const err = document.getElementById('err-msg');
    if (!pw) return;

    btn.disabled = true;
    btn.textContent = '복호화 중...';
    err.textContent = '';

    try {
      const docs = await decryptData(pw);
      mountPortal(docs);
    } catch (ex) {
      err.textContent = '암호가 올바르지 않거나 데이터를 해독할 수 없습니다.';
      document.getElementById('pw-input').select();
    } finally {
      btn.disabled = false;
      btn.textContent = '봉인 해제 (복호화)';
    }
  });
})();
</script>
